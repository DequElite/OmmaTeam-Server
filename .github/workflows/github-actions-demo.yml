name: OmmaTeam Back-End CI pipeline for microservices

on:
  push:
    paths:
      - 'services/**'
      - '.github/**'
  pull_request:
    paths:
      - 'services/**'

jobs:
  register-service:
    name: Run tests for register-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: omma_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/register-service

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 1
          done
      - name: Installing dependencies
        run: npm install
      - name: Building the app
        run: npm run build
      - name: Running  E2E tests
        run: npm run test:e2e
